name: Normalize Maps 1.5.8 custom fields

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Apply normalization
        run: python3 tools/normalize-custom-fields-1.5.8.py

      - name: Validate
        run: |
          ! grep -R "infos_label" -n --include='*.php' --include='*.thtml' .
          grep -q "function MAPS_renderPublicCustomFields" functions.inc
          grep -q "MAPS_renderPublicCustomFields(\$marker, 'compact')" functions.inc
          grep -q "MAPS_renderPublicCustomFields(\$marker, 'detail')" functions.inc
          php -l functions.inc

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc CUSTOM-FIELDS-AUDIT-1.5.8.md RELEASE-NOTES-1.5.8.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize public Maps custom field rendering [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
