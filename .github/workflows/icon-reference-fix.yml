name: Icon reference integrity migration

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-icon-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply icon reference and packaging lint patch
        shell: bash
        run: |
          printf '%s' ' aWNvbl9pZCcsICRpZCk7IiIiCnN = s.replace("ICAn aWNvbl9pZCcs", "ICAn icon_id',") if False else s
# Rebuild the exact replacement without encoded editing artifacts.
new = """                DB_query(
                    "UPDATE {$_TABLES['maps_markers']} SET mk_icon=0, mk_default=1 WHERE mk_icon=" . $id
                );
                DB_query(
                    "UPDATE {$_TABLES['maps_maps']} SET mmk_icon=0, mmk_default=1 WHERE mmk_icon=" . $id
                );
                DB_delete($_TABLES['maps_map_icons'], 'icon_id', $id);"""
if old not in s:
    raise SystemExit("icon delete association anchor not found")
s = s.replace(old, new, 1)
p.write_text(s, encoding="utf-8")

p = Path(".github/workflows/package.yml")
s = p.read_text(encoding="utf-8")
old = """          php -l source/admin/overlay_edit.php
          php -l source/admin/overlays.php
          php -l source/admin/ajax.php"""
new = """          php -l source/admin/overlay_edit.php
          php -l source/admin/overlay_group_edit.php
          php -l source/admin/overlays.php
          php -l source/admin/icons.php
          php -l source/admin/ajax.php"""
if old not in s:
    raise SystemExit("package lint anchor not found")
s = s.replace(old, new, 1)
p.write_text(s, encoding="utf-8")
' | base64 -d > /tmp/icon-reference-fix.py
          python3 /tmp/icon-reference-fix.py
      - name: Lint changed PHP files
        run: |
          php -l admin/icons.php
          php -l admin/overlay_group_edit.php
      - name: Commit integrity fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/icons.php .github/workflows/package.yml
          git commit -m 'Cover map default icon references [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
