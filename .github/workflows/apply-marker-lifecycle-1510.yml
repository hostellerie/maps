name: Apply Maps 1.5.10 marker lifecycle

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/apply-marker-lifecycle-1510.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Apply lifecycle migration
        run: |
          python3 tools/apply-marker-lifecycle-1510.py
          php -l interoperability.php
          php -l admin/marker_edit.php
          php -l public_html/markers.php
          php -l services.inc.php
          php -l admin/import_export.php
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interoperability.php admin/marker_edit.php public_html/markers.php services.inc.php admin/import_export.php RELEASE-NOTES-1.5.10.md
          git commit -m 'Add generic Maps marker lifecycle notifications [skip ci]'
          git push origin HEAD:modernize/maps-1.5

# Retry after temporarily pausing the package workflow.
