name: Fix marker service internal mutation access
on:
  push:
    branches:
      - modernize/maps-1.5
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - run: git pull --rebase origin modernize/maps-1.5
      - name: Patch service access model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('services.inc.php')
          s=p.read_text()
          s=s.replace('function MAPS_serviceMarkerRow($markerId, $publicOnly = true)', 'function MAPS_serviceMarkerRow($markerId, $publicOnly = true, $checkAccess = true)')
          old="""    $access = SEC_hasAccess((int)$row['owner_id'], (int)$row['group_id'], (int)$row['perm_owner'], (int)$row['perm_group'], (int)$row['perm_members'], (int)$row['perm_anon']);\n    if ($access < 2) {\n        return false;\n    }\n"""
          new="""    if ($checkAccess) {\n        $access = SEC_hasAccess((int)$row['owner_id'], (int)$row['group_id'], (int)$row['perm_owner'], (int)$row['perm_group'], (int)$row['perm_members'], (int)$row['perm_anon']);\n        if ($access < 2) {\n            return false;\n        }\n    }\n"""
          if old not in s: raise SystemExit('access anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("$row=MAPS_serviceMarkerRow($markerId,false);", "$row=MAPS_serviceMarkerRow($markerId,false,false);",1)
          s=s.replace("$updated=MAPS_serviceMarkerRow($markerId,false);", "$updated=MAPS_serviceMarkerRow($markerId,false,false);",1)
          p.write_text(s)
          PY
          php -l services.inc.php
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services.inc.php
          git commit -m 'Allow trusted marker validity services outside viewer permissions [skip ci]' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
