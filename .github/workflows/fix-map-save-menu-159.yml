name: Fix Maps 1.5.9 map save and menu integration

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/fix-map-save-menu-159.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply fixes
        run: python3 tools/fix-map-save-menu-159.py
      - name: PHP lint
        run: |
          php -l admin/map_edit.php
          php -l functions.inc
      - name: Verify behavior
        run: |
          grep -q "site_url.*index.php?mode=map&mid=" admin/map_edit.php
          grep -q "function plugin_getmenuitems_maps" functions.inc
          grep -q "site_url.*index.php" functions.inc
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/map_edit.php functions.inc RELEASE-NOTES-1.5.9.md
          git commit -m 'Fix Maps 1.5.9 post-save preview and plugin menu URL [skip ci]' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin modernize/maps-1.5 && git push origin HEAD:modernize/maps-1.5 && exit 0
            sleep 3
          done
          exit 1
