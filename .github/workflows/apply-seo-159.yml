name: Apply Maps 1.5.9 SEO migration

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/apply-seo-159.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply SEO changes
        run: python3 tools/apply-seo-159.py
      - name: PHP lint
        run: |
          php -l public_html/index.php
          php -l public_html/markers.php
          php -l functions.inc
          php -l interoperability.php
          php -l distribution.php
          php -l maps.php
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_html/index.php public_html/markers.php functions.inc interoperability.php distribution.php templates/map.thtml RELEASE-NOTES-1.5.9.md maps.php
          git commit -m 'Optimize Maps 1.5.9 public SEO [skip ci]' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin modernize/maps-1.5 && git push origin HEAD:modernize/maps-1.5 && exit 0
            sleep 3
          done
          exit 1
