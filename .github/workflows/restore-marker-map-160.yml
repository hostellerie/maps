name: Restore Maps 1.6.0 marker map

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/restore-marker-map-160.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Apply final public refinements
        run: |
          python3 tools/restore-marker-map-160.py
          php -l public_html/index.php
          php -l functions.inc
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_html/index.php functions.inc templates/marker_map.thtml RELEASE-NOTES-1.6.0.md
          git commit -m 'Restore marker map and directions for Maps 1.6.0 [skip ci]'
          git push origin HEAD:modernize/maps-1.5
