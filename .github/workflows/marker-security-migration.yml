name: Marker security migration

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-marker-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply marker security patch
        shell: bash
        run: python3 -c "$(printf '%s' '' | base64 -d)"
      - name: Lint marker editor
        run: php -l admin/marker_edit.php
      - name: Commit marker security patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/marker_edit.php
          git commit -m 'Protect marker mutations with CSRF [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
