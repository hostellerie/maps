name: Implement Maps 1.5.9 marker services

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - run: git pull --rebase origin modernize/maps-1.5
      - run: python3 tools/implement-marker-services-1.5.9.py
      - name: Validate PHP and service surface
        run: |
          php -l services.inc.php
          php -l functions.inc
          php -l maps.php
          php -l autoinstall.php
          php -l sql/mysql_install.php
          grep -q "service_marker_list_maps" services.inc.php
          grep -q "service_marker_get_maps" services.inc.php
          grep -q "service_marker_render_maps" services.inc.php
          grep -q "service_marker_set_validity_maps" services.inc.php
          grep -q "service_marker_extend_validity_maps" services.inc.php
          grep -q "pi_version' => '1.5.9'" autoinstall.php
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autoinstall.php maps.php functions.inc services.inc.php sql/mysql_install.php RELEASE-NOTES-1.5.9.md .github/workflows/package.yml
          git commit -m 'Add Maps 1.5.9 marker service API [skip ci]' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
