name: Overlay security migration v2

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-overlay-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply overlay security patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/overlay-security.py
          python3 /tmp/overlay-security.py
      - name: Lint overlay editor
        run: php -l admin/overlay_edit.php
      - name: Commit overlay security patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/overlay_edit.php templates/overlay_form.thtml
          git commit -m 'Protect overlay mutations and uploads [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
