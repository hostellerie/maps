name: Finalize Maps 1.6.0 release

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/finalize-160.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Apply release metadata
        run: |
          python3 tools/finalize-160.py
          find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './build/*' -not -path './tools/*' -print0 | xargs -0 -n1 php -l
      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!dist'
          git commit -m 'Finalize Maps 1.6.0 stable release [skip ci]'
          git push origin HEAD:modernize/maps-1.5
