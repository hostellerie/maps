name: Migrate Geeklog rendering

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Replace legacy page rendering
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          targets = []
          for pattern in ('admin/*.php', 'public_html/*.php', 'functions.inc'):
              targets.extend(root.glob(pattern))

          changed = []
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'COM_siteHeader(' not in text and 'COM_siteFooter(' not in text:
                  continue
              new = text.replace('COM_siteHeader(', 'MAPS_compatSiteHeader(')
              new = new.replace('COM_siteFooter(', 'MAPS_compatSiteFooter(')
              new = new.replace('COM_output($display);', 'MAPS_compatOutput($display);')
              new = new.replace('COM_output($output);', 'MAPS_compatOutput($output);')
              new = new.replace('COM_output($retval);', 'MAPS_compatOutput($retval);')
              new = new.replace('echo $display;\n', 'MAPS_compatOutput($display);\n')
              new = new.replace('echo $output;\n', 'MAPS_compatOutput($output);\n')
              new = new.replace('echo $retval;\n', 'MAPS_compatOutput($retval);\n')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          f = Path('functions.inc')
          text = f.read_text(encoding='utf-8')
          marker = "require_once $_CONF['path'] . 'plugins/maps/maps.php';\n"
          helper = r'''

/**
 * Compatibility rendering layer.
 * Geeklog 2.2.x pages are built exclusively with COM_createHTMLDocument().
 * Geeklog 2.1.1 falls back to the historical site header/footer functions.
 */
function MAPS_compatSiteHeader()
{
    global $_MAPS_RENDER_TITLE;

    $args = func_get_args();
    if (isset($args[1]) && $args[1] !== '') {
        $_MAPS_RENDER_TITLE = $args[1];
    }

    if (function_exists('COM_createHTMLDocument')) {
        return '';
    }

    return call_user_func_array('COM_' . 'siteHeader', $args);
}

function MAPS_compatSiteFooter()
{
    if (function_exists('COM_createHTMLDocument')) {
        return '';
    }

    return call_user_func_array('COM_' . 'siteFooter', func_get_args());
}

function MAPS_compatOutput($content, $title = '')
{
    global $_MAPS_RENDER_TITLE;

    if (function_exists('COM_createHTMLDocument')) {
        if ($title === '' && isset($_MAPS_RENDER_TITLE)) {
            $title = $_MAPS_RENDER_TITLE;
        }
        $options = array();
        if ($title !== '') {
            $options['pagetitle'] = $title;
        }
        $content = COM_createHTMLDocument($content, $options);
    }

    COM_output($content);
}
'''
          if 'function MAPS_compatSiteHeader()' not in text:
              if marker not in text:
                  raise SystemExit('Unable to locate Maps runtime include marker in functions.inc')
              text = text.replace(marker, marker + helper, 1)
              f.write_text(text, encoding='utf-8')
              if 'functions.inc' not in changed:
                  changed.append('functions.inc')

          print('Changed files:')
          for item in changed:
              print(item)
          PY

          echo 'Remaining direct legacy rendering calls:'
          if grep -RInE 'COM_site(Header|Footer)\(' admin public_html functions.inc --include='*.php' --include='*.inc'; then
            echo 'Legacy rendering calls remain.'
            exit 1
          fi

          find . -type f \( -name '*.php' -o -name '*.inc' \) -print0 | while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done

      - name: Commit rendering migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No rendering migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin public_html functions.inc
          git commit -m 'Use COM_createHTMLDocument on Geeklog 2.2'
          git push origin HEAD:modernize/maps-1.5
