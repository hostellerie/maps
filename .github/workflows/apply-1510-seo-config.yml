name: Apply Maps 1.5.10 SEO configuration

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - '.github/workflows/apply-1510-seo-config.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 tools/apply-1510-seo-config.py
          php -l autoinstall.php
          php -l install_defaults.php
          php -l functions.inc
          php -l public_html/index.php
          php -l language/english.php
          php -l language/french_france_utf-8.php
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autoinstall.php install_defaults.php functions.inc public_html/index.php language/english.php language/french_france_utf-8.php RELEASE-NOTES-1.5.10.md
          git commit -m 'Add Maps 1.5.10 landing page SEO configuration [skip ci]'
          git push origin HEAD:modernize/maps-1.5
