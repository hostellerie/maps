name: Exact alpha18 final files sync

on:
  pull_request:
    branches:
      - modernize/maps-1.5
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Rebuild and verify exact alpha18 files
        shell: python
        run: |
          import base64
          import gzip
          import subprocess
          from pathlib import Path

          def verify(path, expected):
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              print('%s: %s' % (path, actual))
              if actual != expected:
                  raise SystemExit('%s mismatch: expected %s, got %s' % (path, expected, actual))

          for target, payload_path, expected in (
              ('language/english.php', '.sync-alpha18/english.gz.b64', '65be66ca94f40fb7d8bdecf82ae104fc8cd6558e'),
              ('language/french_france_utf-8.php', '.sync-alpha18/french.gz.b64', 'aadab7cdeb0d7a4e328c40d129ea42f81c17dc33'),
          ):
              payload = Path(payload_path).read_text(encoding='utf-8').strip()
              Path(target).write_bytes(gzip.decompress(base64.b64decode(payload)))
              verify(target, expected)

          marker_parts = [Path('.sync-alpha18/marker.php.%02d' % i).read_bytes() for i in range(5)]
          expected_sizes = [4688, 11593, 10468, 10192, 5528]
          actual_sizes = [len(part) for part in marker_parts]
          print('marker chunks:', actual_sizes)
          if actual_sizes != expected_sizes:
              raise SystemExit('marker chunk size mismatch: expected %s, got %s' % (expected_sizes, actual_sizes))
          Path('admin/marker_edit.php').write_bytes(b''.join(marker_parts))
          verify('admin/marker_edit.php', 'b36ceec1635d3972f6a61824a3fa715c6ca26ff0')

          import_path = Path('admin/import_export.php')
          import_data = import_path.read_bytes()
          if import_data.endswith(b'\n'):
              import_data = import_data[:-1]
          import_path.write_bytes(import_data)
          verify('admin/import_export.php', '9dbb247972b9299596fc2a197bedb3e21f67fe82')
      - name: Commit exact alpha18 files and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-alpha18-final-files.yml
          git rm .sync-alpha18/english.gz.b64 .sync-alpha18/french.gz.b64 .sync-alpha18/marker.gz.b64 .sync-alpha18/import.gz.b64
          git rm .sync-alpha18/marker.php.00 .sync-alpha18/marker.php.01 .sync-alpha18/marker.php.02 .sync-alpha18/marker.php.03 .sync-alpha18/marker.php.04
          git add language/english.php language/french_france_utf-8.php admin/marker_edit.php admin/import_export.php
          git commit -m "Sync remaining Maps 1.5.6 alpha18 files exactly"
          git push origin HEAD:modernize/maps-1.5
