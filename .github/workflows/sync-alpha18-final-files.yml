name: Exact alpha18 final files sync

on:
  push:
    branches:
      - modernize/maps-1.5
    paths:
      - .github/workflows/sync-alpha18-final-files.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - name: Rebuild and verify exact alpha18 files
        shell: python
        run: |
          import base64
          import gzip
          import subprocess
          from pathlib import Path

          files = {
              'language/english.php': ('.sync-alpha18/english.gz.b64', '65be66ca94f40fb7d8bdecf82ae104fc8cd6558e'),
              'language/french_france_utf-8.php': ('.sync-alpha18/french.gz.b64', 'aadab7cdeb0d7a4e328c40d129ea42f81c17dc33'),
              'admin/marker_edit.php': ('.sync-alpha18/marker.gz.b64', 'b36ceec1635d3972f6a61824a3fa715c6ca26ff0'),
              'admin/import_export.php': ('.sync-alpha18/import.gz.b64', '9dbb247972b9299596fc2a197bedb3e21f67fe82'),
          }
          for target, (payload_path, expected) in files.items():
              payload = Path(payload_path).read_text(encoding='utf-8').strip()
              Path(target).write_bytes(gzip.decompress(base64.b64decode(payload)))
              actual = subprocess.check_output(['git', 'hash-object', target], text=True).strip()
              print('%s: %s' % (target, actual))
              if actual != expected:
                  raise SystemExit('%s mismatch: expected %s, got %s' % (target, expected, actual))
      - name: Commit exact alpha18 files and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-alpha18-final-files.yml
          git rm .sync-alpha18/english.gz.b64 .sync-alpha18/french.gz.b64 .sync-alpha18/marker.gz.b64 .sync-alpha18/import.gz.b64
          git add language/english.php language/french_france_utf-8.php admin/marker_edit.php admin/import_export.php
          git commit -m "Sync remaining Maps 1.5.6 alpha18 files exactly"
          git push origin HEAD:modernize/maps-1.5
