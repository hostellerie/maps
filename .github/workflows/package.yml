name: Build Maps 1.7 installable archive

on:
  push:
    branches:
      - update/maps-1.7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Maps 1.7 branch
        uses: actions/checkout@v4
        with:
          ref: update/maps-1.7
          fetch-depth: 0

      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './build/*' \
            -not -path './dist/*' \
            -not -path './tools/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Run Maps regression tests
        shell: bash
        run: |
          set -e
          if compgen -G 'tests/*.php' > /dev/null; then
            for test_file in tests/*.php; do
              php "$test_file"
            done
          fi

      - name: Build installable archive
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build/maps

          cp -a \
            admin \
            autoinstall.php \
            functions.inc \
            install_defaults.php \
            integrations.php \
            interoperability.php \
            distribution.php \
            services.inc.php \
            language \
            maps.php \
            public_html \
            sql \
            templates \
            README.md \
            build/maps/

          if [ -f RELEASE-NOTES-1.7.0.md ]; then
            cp RELEASE-NOTES-1.7.0.md build/maps/
          elif [ -f RELEASE-NOTES-1.6.0.md ]; then
            cp RELEASE-NOTES-1.6.0.md build/maps/
          fi

          cd build
          zip -r maps_1.7.0-dev_2.1.1.zip maps >/dev/null
          unzip -t maps_1.7.0-dev_2.1.1.zip >/dev/null
          test "$(zipinfo -1 maps_1.7.0-dev_2.1.1.zip | head -n 1)" = 'maps/'

      - name: Publish archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-1.7-installable
          path: build/maps_1.7.0-dev_2.1.1.zip
          if-no-files-found: error

      - name: Commit archive to dist
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp build/maps_1.7.0-dev_2.1.1.zip dist/maps_1.7.0-dev_2.1.1.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/maps_1.7.0-dev_2.1.1.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build Maps 1.7 development archive [skip ci]'
          git push origin HEAD:update/maps-1.7
