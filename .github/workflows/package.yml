name: Apply Maps geo autotag parser fix

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Apply parser fix
        shell: bash
        run: |
          cd source
          python3 tools/fix-geo-autotag-160.py
          php -l functions.inc
          grep -Fq "preg_split('/[[:space:]]+/', \$raw)" functions.inc

      - name: Commit parser fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix Maps geo autotag option parsing [skip ci]'
          git push origin HEAD:modernize/maps-1.5
