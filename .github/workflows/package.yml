name: Apply Maps geo autotag modernization

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Apply geo autotag changes
        shell: bash
        run: |
          cd source
          python3 tools/apply-geo-autotag-160.py
          php -l functions.inc
          php -l language/english.php
          php -l language/french_france_utf-8.php
          grep -q 'function MAPS_parseGeoAutotagOptions' functions.inc
          grep -q "if (\$tag === 'geo')" functions.inc
          grep -q '\[geo: Paris, France zoom:12\]' language/english.php
          grep -q 'Geo autotag modernization' RELEASE-NOTES-1.6.0.md

      - name: Commit source changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc language/english.php language/french_france_utf-8.php RELEASE-NOTES-1.6.0.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Modernize Maps geo autotag [skip ci]'
          git push origin HEAD:modernize/maps-1.5
