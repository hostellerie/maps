name: Build installable archive

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Apply guided import UX pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('source/admin/import_export.php')
          text = p.read_text()

