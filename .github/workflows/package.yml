name: Build installable archive

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Apply cluster and pin polish
        shell: bash
        run: |
          cd source
          python3 tools/polish-clusters-pins-160.py

      - name: Lint release files
        shell: bash
        run: |
          find source -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path 'source/build/*' -not -path 'source/tools/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify release metadata and layouts
        shell: bash
        run: |
          set -e
          grep -q "'pi_version' => '1.6.0'" source/autoinstall.php
          grep -q 'Maps Plugin 1.6.0' source/functions.inc
          grep -q 'Maps Plugin 1.6.0' source/maps.php
          grep -q 'Maps 1.6.0' source/README.md
          test -f source/RELEASE-NOTES-1.6.0.md
          grep -q 'maps-page-title' source/public_html/index.php
          grep -q 'maps-markers-heading' source/public_html/index.php
          grep -q 'map_markers_heading' source/language/english.php
          grep -q 'map_markers_heading' source/language/french_france_utf-8.php
          grep -q 'maps-public-list' source/public_html/index.php
          grep -q 'maps-list-card' source/public_html/maps.css
          grep -q 'Explore our maps' source/language/english.php
          grep -q 'Découvrez nos cartes' source/language/french_france_utf-8.php
          grep -q 'marker_singular' source/language/english.php
          grep -q 'marker_singular' source/language/french_france_utf-8.php
          grep -q 'mapsClusterRenderer' source/functions.inc
          grep -q "count >= 50 ? 42" source/functions.inc
          grep -q 'feDropShadow' source/functions.inc
          grep -q 'Marker and cluster visual polish' source/RELEASE-NOTES-1.6.0.md
          grep -q 'maps-admin-title' source/admin/index.php
          grep -q 'maps-admin-menu' source/templates/admin_menu.thtml
          grep -q 'maps-admin-title' source/templates/geocoder.thtml
          grep -q 'maps-directions-panel' source/functions.inc
          grep -q 'maps-marker-meta-facts' source/templates/marker.thtml
          grep -q 'maps-marker-user-url' source/public_html/maps.css
          grep -q 'plainValue = trim(strip_tags' source/functions.inc
          grep -q 'Added by:' source/language/english.php
          grep -q 'Ajouté par :' source/language/french_france_utf-8.php
          ! grep -q 'maps-marker-map-link' source/public_html/index.php
          ! grep -q "\$place\['sameAs'\]" source/public_html/index.php
          ! grep -q 'MAPS_convertLinkToUrl($marker' source/functions.inc
          ! grep -q '<h1' source/templates/marker.thtml

      - name: Build final installable archive
        shell: bash
        run: |
          set -e
          cd source
          rm -rf build
          mkdir -p build/maps
          cp -a admin autoinstall.php functions.inc install_defaults.php integrations.php interoperability.php distribution.php services.inc.php language maps.php public_html sql templates README.md RELEASE-NOTES-1.6.0.md build/maps/
          cd build
          zip -r maps_1.6.0_2.1.1.zip maps >/dev/null
          unzip -t maps_1.6.0_2.1.1.zip >/dev/null
          test "$(zipinfo -1 maps_1.6.0_2.1.1.zip | head -n 1)" = 'maps/'

      - name: Commit source refinements and final archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          mkdir -p dist
          cp build/maps_1.6.0_2.1.1.zip dist/maps_1.6.0_2.1.1.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc RELEASE-NOTES-1.6.0.md
          git add -f dist/maps_1.6.0_2.1.1.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Polish Maps 1.6.0 clusters and pins [skip ci]'
          git push origin HEAD:modernize/maps-1.5
