name: Build installable archive

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Complete lifecycle audit patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/functions.inc')
          s = p.read_text()
          old = """function updateMap($map)\n{\n    global $_TABLES;\n    DB_query(\"UPDATE {$_TABLES['maps_maps']} SET modified='\" . date('YmdHis') . \"' WHERE mid=\" . (int) $map);\n}\n"""
          new = """function updateMap($map)\n{\n    global $_TABLES;\n\n    $map = (int) $map;\n    if ($map <= 0 || (int) DB_count($_TABLES['maps_maps'], 'mid', $map) === 0) {\n        return false;\n    }\n\n    DB_query(\"UPDATE {$_TABLES['maps_maps']} SET modified='\" . date('YmdHis') . \"' WHERE mid=\" . $map);\n    if (!DB_error() && function_exists('PLG_itemSaved')) {\n        PLG_itemSaved($map, 'maps');\n    }\n\n    return !DB_error();\n}\n"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('source/admin/marker_edit.php')
          s = p.read_text()
          marker_anchor = "$requestMode = isset($_REQUEST['mode']) ? $_REQUEST['mode'] : '';\nswitch ($requestMode) {"
          marker_insert = "$requestMode = isset($_REQUEST['mode']) ? $_REQUEST['mode'] : '';\n$markerMapBefore = 0;\nif ($requestMode === 'delete' && !empty($mkid)) {\n    $markerMapBefore = (int) DB_getItem($_TABLES['maps_markers'], 'mid', \"mkid='\" . MAPS_dbEscape($mkid) . \"'\");\n}\nswitch ($requestMode) {"
          if marker_anchor in s and '$markerMapBefore = 0;' not in s:
              s = s.replace(marker_anchor, marker_insert, 1)
          marker_success = """\t\t\tif (DB_affectedRows('') == 1) {\n\t\t\t\t$msg = $LANG_MAPS_1['deletion_succes'];"""
          marker_success_new = """\t\t\tif (DB_affectedRows('') == 1) {\n                if ($markerMapBefore > 0) {\n                    updateMap($markerMapBefore);\n                }\n\t\t\t\t$msg = $LANG_MAPS_1['deletion_succes'];"""
          if marker_success in s and 'updateMap($markerMapBefore);' not in s:
              s = s.replace(marker_success, marker_success_new, 1)
          p.write_text(s)

          p = Path('source/admin/import_export.php')
          s = p.read_text()
          import_old = """\t\t\t\tif ( $mkid_exists == '' and $mkid != '') {\n    \t\t\t\tDB_query ($sql, 0);\n\t\t\t\t} else {"""
          import_new = """\t\t\t\tif ( $mkid_exists == '' and $mkid != '') {\n    \t\t\t\tDB_query ($sql, 0);\n                    if (!DB_error()) {\n                        updateMap($map_id);\n                    }\n\t\t\t\t} else {"""
          if import_old in s and 'updateMap($map_id);' not in s:
              s = s.replace(import_old, import_new, 1)
          p.write_text(s)

          p = Path('source/admin/overlay_edit.php')
          s = p.read_text()
          overlay_anchor = "$oid = $_REQUEST['oid'];\n$display .= MAPS_compatSiteHeader('menu', $LANG_MAPS_1['plugin_name']);"
          overlay_insert = "$oid = $_REQUEST['oid'];\n$overlayAffectedMaps = array();\nif ((int) $oid > 0 && isset($_REQUEST['mode'])\n    && in_array($_REQUEST['mode'], array('save', 'delete'), true)) {\n    $affectedResult = DB_query(\"SELECT DISTINCT mo_mid FROM {$_TABLES['maps_map_overlay']} WHERE mo_oid=\" . (int) $oid);\n    while ($affected = DB_fetchArray($affectedResult)) {\n        if (isset($affected['mo_mid']) && (int) $affected['mo_mid'] > 0) {\n            $overlayAffectedMaps[(int) $affected['mo_mid']] = true;\n        }\n    }\n}\nregister_shutdown_function(function () use (&$overlayAffectedMaps) {\n    foreach (array_keys($overlayAffectedMaps) as $affectedMid) {\n        updateMap((int) $affectedMid);\n    }\n});\n$display .= MAPS_compatSiteHeader('menu', $LANG_MAPS_1['plugin_name']);"
          if overlay_anchor in s and '$overlayAffectedMaps = array();' not in s:
              s = s.replace(overlay_anchor, overlay_insert, 1)
          p.write_text(s)
          PY

      - name: Harden map editor CSRF
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/admin/map_edit.php')
          s = p.read_text()

          token_anchor = "    $template->set_var('site_admin_url', $_CONF['site_admin_url']);\n"
          token_insert = """    $template->set_var('site_admin_url', $_CONF['site_admin_url']);
    $csrfToken = SEC_createToken();
    $template->set_var(
        'csrf_token',
        '<input type=\"hidden\" name=\"' . htmlspecialchars(CSRF_TOKEN, ENT_QUOTES, 'UTF-8')
        . '\" value=\"' . htmlspecialchars($csrfToken, ENT_QUOTES, 'UTF-8') . '\">'
    );
"""
          if token_anchor in s and "'csrf_token'" not in s:
              s = s.replace(token_anchor, token_insert, 1)

          guard_anchor = "$content = MAPS_admin_menu();\n\nif ($mode === 'delete' && $mid > 0) {"
          guard_insert = """$content = MAPS_admin_menu();

if (in_array($mode, array('save', 'delete'), true)
    && ($_SERVER['REQUEST_METHOD'] !== 'POST' || !SEC_checkToken())
) {
    COM_accessLog('Invalid CSRF token on Maps map editor mutation.');
    $content .= COM_showMessageText($MESSAGE[29], $MESSAGE[30]);
    COM_output(COM_createHTMLDocument($content, array('pagetitle' => $MESSAGE[30])));
    exit;
}

if ($mode === 'delete' && $mid > 0) {"""
          if guard_anchor in s and 'Invalid CSRF token on Maps map editor mutation.' not in s:
              s = s.replace(guard_anchor, guard_insert, 1)

          p.write_text(s)
          PY

      - name: Lint interoperability and security-critical files
        shell: bash
        run: |
          php -l source/interoperability.php
          php -l source/integrations.php
          php -l source/distribution.php
          php -l source/maps.php
          php -l source/functions.inc
          php -l source/admin/edit_functions.php
          php -l source/admin/map_edit.php
          php -l source/admin/marker_edit.php
          php -l source/admin/import_export.php
          php -l source/admin/overlay_edit.php
          php -l source/admin/overlays.php
          php -l source/admin/ajax.php

      - name: Build installable archive
        shell: bash
        run: |
          set -e
          cd source
          rm -rf build
          mkdir -p build/maps
          cp -a admin autoinstall.php functions.inc install_defaults.php integrations.php interoperability.php distribution.php language maps.php public_html sql templates README.md build/maps/
          cd build
          zip -r maps-1.5.7-test.zip maps >/dev/null

      - name: Commit validated patches and test archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          mkdir -p dist
          cp build/maps-1.5.7-test.zip dist/maps-1.5.7-test.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc admin/map_edit.php admin/marker_edit.php admin/import_export.php admin/overlay_edit.php
          git add -f dist/maps-1.5.7-test.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply validated Maps release patches [skip ci]'
          git push origin HEAD:modernize/maps-1.5
