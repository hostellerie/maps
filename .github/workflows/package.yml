name: Build installable archive

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Apply guided import UX pass
        shell: bash
        run: |
          cd source
          python3 tools/apply-guided-import-160.py

      - name: Lint release files
        shell: bash
        run: |
          find source -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path 'source/build/*' -not -path 'source/tools/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Verify guided import and release metadata
        shell: bash
        run: |
          set -e
          grep -q "'pi_version' => '1.6.0'" source/autoinstall.php
          grep -q 'MAPS_getRecommendedImportFields' source/admin/import_export.php
          grep -q 'MAPS_importPermissionValues' source/admin/import_export.php
          grep -q 'maps-import-preview-table' source/admin/import_export.php
          grep -q 'maps-import-minimum' source/templates/import_export_form.thtml
          grep -q 'Maps 1.6.0 guided CSV import assistant' source/public_html/maps.css
          grep -q "'import_preview_title'" source/language/english.php
          grep -q "'import_preview_title'" source/language/french_france_utf-8.php
          grep -q 'Guided CSV import assistant' source/RELEASE-NOTES-1.6.0.md
          grep -q 'hasSuppliedPermissions' source/admin/marker_edit.php
          grep -q 'MAPS_displayOverlaysToAdd($map' source/admin/map_edit.php

      - name: Build final installable archive
        shell: bash
        run: |
          set -e
          cd source
          rm -rf build
          mkdir -p build/maps
          cp -a admin autoinstall.php functions.inc install_defaults.php integrations.php interoperability.php distribution.php services.inc.php language maps.php public_html sql templates README.md RELEASE-NOTES-1.6.0.md build/maps/
          cd build
          zip -r maps_1.6.0_2.1.1.zip maps >/dev/null
          unzip -t maps_1.6.0_2.1.1.zip >/dev/null
          test "$(zipinfo -1 maps_1.6.0_2.1.1.zip | head -n 1)" = 'maps/'

      - name: Commit guided import UX and final archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          mkdir -p dist
          cp build/maps_1.6.0_2.1.1.zip dist/maps_1.6.0_2.1.1.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/import_export.php templates/import_export_form.thtml public_html/maps.css language/english.php language/french_france_utf-8.php RELEASE-NOTES-1.6.0.md
          git add -f dist/maps_1.6.0_2.1.1.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Improve Maps guided CSV import [skip ci]'
          git push origin HEAD:modernize/maps-1.5
