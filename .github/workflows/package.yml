name: Build installable archive

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch modernize/maps-1.5 \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git source

      - name: Lint interoperability, install and security-critical files
        shell: bash
        run: |
          php -l source/autoinstall.php
          php -l source/install_defaults.php
          php -l source/sql/mysql_install.php
          php -l source/interoperability.php
          php -l source/integrations.php
          php -l source/distribution.php
          php -l source/maps.php
          php -l source/functions.inc
          php -l source/admin/edit_functions.php
          php -l source/admin/index.php
          php -l source/admin/map_edit.php
          php -l source/admin/marker_edit.php
          php -l source/admin/markers.php
          php -l source/admin/import_export.php
          php -l source/admin/overlay_edit.php
          php -l source/admin/overlay_group_edit.php
          php -l source/admin/overlays.php
          php -l source/admin/icons.php
          php -l source/admin/geocoder.php
          php -l source/admin/ajax.php

      - name: Build installable archive
        shell: bash
        run: |
          set -e
          cd source
          rm -rf build
          mkdir -p build/maps
          cp -a admin autoinstall.php functions.inc install_defaults.php integrations.php interoperability.php distribution.php language maps.php public_html sql templates README.md RELEASE-NOTES-1.5.7.md build/maps/
          cd build
          zip -r maps-1.5.7-test.zip maps >/dev/null

      - name: Commit test archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd source
          mkdir -p dist
          cp build/maps-1.5.7-test.zip dist/maps-1.5.7-test.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/maps-1.5.7-test.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild Maps 1.5.7 test archive [skip ci]'
          git push origin HEAD:modernize/maps-1.5
