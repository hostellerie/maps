name: Install runtime migration

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-install-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply install/runtime fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/install-runtime-fix.py
          python3 /tmp/install-runtime-fix.py
      - name: Lint changed PHP files
        shell: bash
        run: |
          php -l maps.php
          php -l admin/import_export.php
          php -l sql/mysql_install.php
      - name: Commit install/runtime fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maps.php admin/import_export.php sql/mysql_install.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Harden Maps install and strict SQL import [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
