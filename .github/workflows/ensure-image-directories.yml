name: Ensure Maps image directories

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  ensure-image-directories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Apply directory helper
        run: python3 tools/ensure-image-directories.py

      - name: Verify PHP syntax
        run: |
          php -l functions.inc
          php -l admin/icons.php
          php -l admin/overlays.php

      - name: Commit and push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc admin/icons.php admin/overlays.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Create missing Maps image directories automatically [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
