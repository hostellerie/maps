name: Apply Maps 1.5.8 custom field visibility

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Apply change
        run: python3 tools/apply-custom-field-visibility-1.5.8.py

      - name: Validate
        run: |
          grep -q "function MAPS_shouldShowCustomField" functions.inc
          grep -q "MAPS_shouldShowCustomField" admin/marker_edit.php
          grep -q "MAPS_shouldShowCustomField" public_html/markers.php
          php -l functions.inc
          php -l admin/marker_edit.php
          php -l public_html/markers.php

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc admin/marker_edit.php public_html/markers.php RELEASE-NOTES-1.5.8.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Hide unused marker custom fields in edit forms [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then
              exit 0
            fi
            sleep 2
          done
          exit 1
