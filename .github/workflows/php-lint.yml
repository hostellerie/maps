name: PHP compatibility lint

on:
  push:
    branches:
      - modernize/maps-1.5
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.1']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
