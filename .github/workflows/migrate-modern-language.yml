name: Migrate Maps modern language labels

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-modern-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Migrate language labels
        run: python3 tools/migrate-modern-language.py

      - name: Verify no modern.php references remain
        run: |
          test ! -e language/modern.php
          ! grep -R "modern.php" -n --include='*.php' .

      - name: Verify PHP syntax
        run: |
          php -l language/english.php
          php -l language/french_france_utf-8.php
          php -l functions.inc

      - name: Commit and push migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- tools/migrate-modern-language.py .github/workflows/migrate-modern-language.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Move Maps configuration labels into language files [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
