name: Fix Maps map overlay icon UX

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix-map-overlay-icon-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Apply UX fixes
        run: python3 tools/fix-map-overlay-icon-ux.py

      - name: Verify PHP syntax
        run: |
          php -l admin/index.php
          php -l admin/icons.php
          php -l admin/map_edit.php
          php -l language/english.php
          php -l language/french_france_utf-8.php

      - name: Commit and push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php admin/icons.php admin/map_edit.php language/english.php language/french_france_utf-8.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix map overlay labels and icon preview refresh [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
