name: Fix Geeklog 2.2.2 editor and Item Info

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Lint changed PHP files
        run: |
          php -l admin/index.php
          php -l admin/map_edit.php
          php -l interoperability.php
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php admin/map_edit.php interoperability.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Geeklog 2.2.2 map editor and Item Info [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
