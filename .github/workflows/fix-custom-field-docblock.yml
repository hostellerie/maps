name: Fix custom field docblock

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0
      - run: |
          git pull --rebase origin modernize/maps-1.5
          python3 - <<'PY'
          from pathlib import Path
          p=Path('functions.inc')
          s=p.read_text(encoding='utf-8')
          render='''/**\n * Render configured marker custom fields for public output.\n *\n * A field is public only when both its configured label and stored value are\n * non-empty. Values keep Maps\' historical autotag support through\n * PLG_replaceTags(), while labels are always escaped.\n *\n * @param array  $marker\n * @param string $layout compact for info windows, detail for marker pages\n * @return string\n */\n'''
          helper='''/**\n * Return whether a configurable marker custom field should be shown in forms.\n'''
          if render + helper not in s:
              raise SystemExit('docblock anchor not found')
          s=s.replace(render + helper, helper, 1)
          fn='function MAPS_renderPublicCustomFields($marker, $layout = \'detail\')\n{'
          s=s.replace(fn, render + fn, 1)
          p.write_text(s, encoding='utf-8')
          PY
          php -l functions.inc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc
          git commit -m 'Tidy custom field helper documentation [skip ci]' || exit 0
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
