name: Fix Maps map default icon

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix-map-default-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
          fetch-depth: 0

      - name: Sync branch
        run: git pull --rebase origin modernize/maps-1.5

      - name: Apply map default icon fix
        run: python3 tools/fix-map-default-icon.py

      - name: Verify PHP syntax
        run: php -l functions.inc

      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.inc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Respect explicit map icon for inherited markers [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin modernize/maps-1.5
            if git push origin HEAD:modernize/maps-1.5; then exit 0; fi
            sleep 2
          done
          exit 1
