name: Fix marker editor runtime compatibility

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix-marker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply fixes
        run: |
          printf '%s' '' | base64 -d > /tmp/fix-marker.py
          python3 /tmp/fix-marker.py
      - name: Lint changed PHP files
        run: |
          php -l admin/index.php
          php -l admin/marker_edit.php
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php admin/marker_edit.php templates/marker_form.thtml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix marker editor runtime on Geeklog 2.1.1 and 2.2.2 [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
