name: Fix marker editor runtime compatibility

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  fix-marker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5

      - name: Apply fixes
        run: python3 tools/fix-marker-runtime.py

      - name: Verify changes
        shell: bash
        run: |
          php -l admin/index.php
          php -l admin/marker_edit.php
          grep -q 'type="date" id="from"' templates/marker_form.thtml
          grep -q 'typeof google.maps.Geocoder !== "function"' admin/marker_edit.php
          if grep -q '\.datepicker' admin/marker_edit.php; then exit 1; fi
          if grep -q "field' => 'view'" admin/index.php; then exit 1; fi

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php admin/marker_edit.php templates/marker_form.thtml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix marker editor runtime on Geeklog 2.1.1 and 2.2.2 [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
