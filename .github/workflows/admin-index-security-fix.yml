name: Admin index security migration

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-admin-index-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5
      - name: Apply admin index security patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/admin-index-security.py
          python3 /tmp/admin-index-security.py
      - name: Lint admin index
        run: php -l admin/index.php
      - name: Commit admin index hardening
        shell: bash
        run: |
          if git diff --quiet -- admin/index.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php
          git commit -m 'Protect admin geolocation action [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
