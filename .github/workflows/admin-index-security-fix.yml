name: Admin index security migration

on:
  push:
    branches:
      - modernize/maps-1.5

permissions:
  contents: write

jobs:
  migrate-admin-index-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/maps-1.5

      - name: Apply admin index security patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('admin/index.php')
          s = p.read_text(encoding='utf-8')

          old = """            $map_title = MAPS_decodeStoredText($A['name']);
            $url = $_MAPS_CONF['site_url'] .
                                 '/index.php?mode=map&mid=' . $A['mid'];
            $link = COM_createLink($map_title, $url, array('title'=>$LANG_MAPS_1['title_display']));

            if ($A['description'] != '') {
                $retval = COM_getTooltip($map_title, MAPS_decodeStoredText($A['description']), $url, $map_title, 'help');
            } else {
                $retval = $link;
            }"""
          new = """            $map_title = MAPS_decodeStoredText($A['name']);
            $safeTitle = htmlspecialchars($map_title, ENT_QUOTES, 'UTF-8');
            $url = $_MAPS_CONF['site_url']
                . '/index.php?mode=map&mid=' . (int) $A['mid'];
            $link = COM_createLink(
                $safeTitle,
                $url,
                array('title' => htmlspecialchars($LANG_MAPS_1['title_display'], ENT_QUOTES, 'UTF-8'))
            );

            if ($A['description'] != '') {
                $safeDescription = htmlspecialchars(
                    MAPS_decodeStoredText($A['description']),
                    ENT_QUOTES,
                    'UTF-8'
                );
                $retval = COM_getTooltip($safeTitle, $safeDescription, $url, $safeTitle, 'help');
            } else {
                $retval = $link;
            }"""
          if old not in s:
              raise SystemExit('map list anchor not found')
          s = s.replace(old, new, 1)

          old = """        default:
            $retval = stripslashes($fieldvalue);
            break;"""
          new = """        default:
            $retval = htmlspecialchars(stripslashes((string) $fieldvalue), ENT_QUOTES, 'UTF-8');
            break;"""
          if old not in s:
              raise SystemExit('default output anchor not found')
          s = s.replace(old, new, 1)

          old = """    $html .= '<p><a href="' . $_CONF['site_admin_url'] . '/plugins/maps/index.php?mode=setgeolocation"><strong>' . $LANG_MAPS_1['set_user_geo'] . '</strong></a></p>';"""
          new = """    $geoToken = SEC_createToken();
    $html .= '<form method="post" action="' . htmlspecialchars($_CONF['site_admin_url'], ENT_QUOTES, 'UTF-8')
        . '/plugins/maps/index.php" class="maps-inline-action">'
        . '<input type="hidden" name="mode" value="setgeolocation">'
        . '<input type="hidden" name="' . CSRF_TOKEN . '" value="'
        . htmlspecialchars($geoToken, ENT_QUOTES, 'UTF-8') . '">'
        . '<button type="submit"><strong>'
        . htmlspecialchars($LANG_MAPS_1['set_user_geo'], ENT_QUOTES, 'UTF-8')
        . '</strong></button></form>';"""
          if old not in s:
              raise SystemExit('geo link anchor not found')
          s = s.replace(old, new, 1)

          old = """$mode = isset($_REQUEST['mode']) ? $_REQUEST['mode'] : '';

switch ($mode) {"""
          new = """$requestMethod = isset($_SERVER['REQUEST_METHOD']) ? strtoupper($_SERVER['REQUEST_METHOD']) : 'GET';
$requestData = $requestMethod === 'POST' ? $_POST : $_GET;
$mode = isset($requestData['mode']) ? COM_applyFilter($requestData['mode']) : '';

switch ($mode) {"""
          if old not in s:
              raise SystemExit('main mode anchor not found')
          s = s.replace(old, new, 1)

          old = """    case 'setgeolocation':
        MAPS_setGeoLocation();
        echo COM_refresh($_CONF['site_admin_url'] . '/plugins/maps/index.php?msg=' . urlencode($LANG_MAPS_1['set_geo_location']));
        exit;"""
          new = """    case 'setgeolocation':
        if ($requestMethod !== 'POST' || !SEC_checkToken()) {
            COM_accessLog('Rejected Maps geolocation mutation because of missing or invalid CSRF token.');
            echo COM_refresh(
                $_CONF['site_admin_url'] . '/plugins/maps/index.php?msg='
                . urlencode('Invalid or expired security token.')
            );
            exit;
        }
        MAPS_setGeoLocation();
        echo COM_refresh(
            $_CONF['site_admin_url'] . '/plugins/maps/index.php?msg='
            . urlencode($LANG_MAPS_1['set_geo_location'])
        );
        exit;"""
          if old not in s:
              raise SystemExit('setgeolocation anchor not found')
          s = s.replace(old, new, 1)

          old = """        if (!empty($_REQUEST['msg'])) {
            $display .= COM_startBlock($LANG_MAPS_1['message'], '', 'blockheader-message.thtml');
            $display .= htmlspecialchars((string) $_REQUEST['msg'], ENT_QUOTES, 'UTF-8');"""
          new = """        if (!empty($requestData['msg'])) {
            $display .= COM_startBlock($LANG_MAPS_1['message'], '', 'blockheader-message.thtml');
            $display .= htmlspecialchars((string) $requestData['msg'], ENT_QUOTES, 'UTF-8');"""
          if old not in s:
              raise SystemExit('message anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Lint admin index
        run: php -l admin/index.php

      - name: Commit admin index hardening
        shell: bash
        run: |
          if git diff --quiet -- admin/index.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.php
          git commit -m 'Protect admin geolocation action [skip ci]'
          git pull --rebase origin modernize/maps-1.5
          git push origin HEAD:modernize/maps-1.5
